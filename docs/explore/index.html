<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Hello-AI Explore：从活跃 AI 开源项目中搜索、筛选、对比并发现潜力项目。"
    />
    <title>Hello-AI Explore</title>
    <meta name="theme-color" content="#f6f2ea" />
    <link rel="icon" href="/assets/img/logo.png" />
    <link rel="stylesheet" href="./assets/style.css" />
  </head>
  <body>
    <a class="skip-link" href="#appMain">跳到主要内容</a>
    <div class="app-shell">
      <header class="topbar">
        <a class="brand" href="./" aria-label="Hello-AI Explore">
          <img src="/assets/img/logo.png" alt="" width="36" height="36" />
          <span>
            <strong>Hello-AI</strong>
            <small>Explore</small>
          </span>
        </a>

        <nav class="main-nav" aria-label="Explore 页面">
          <button class="nav-button" type="button" data-route="radar">发现</button>
          <button class="nav-button" type="button" data-route="explore">全部项目</button>
          <button class="nav-button" type="button" data-route="compare">对比</button>
          <button class="nav-button" type="button" data-route="saved">收藏</button>
        </nav>

        <a class="docs-link" href="/home/">Docs</a>
      </header>

      <section class="command-band" aria-label="项目搜索">
        <div class="command-inner">
          <div class="command-copy">
            <p class="kicker">AI PROJECT FINDER</p>
            <h1>从海量项目里，先找到值得试的&nbsp;3&nbsp;个</h1>
          </div>

          <label class="search-box" for="globalSearch">
            <span class="search-symbol" aria-hidden="true">⌕</span>
            <input
              id="globalSearch"
              name="project-search"
              type="search"
              aria-label="搜索 AI 项目、技术或目标"
              autocomplete="off"
              spellcheck="false"
              placeholder="搜索项目、技术或目标，例如 Agent、GraphRAG、本地模型…"
            />
          </label>

          <div class="stat-strip" id="statStrip" aria-live="polite"></div>
          <div class="quick-strip" id="quickStrip" aria-label="快捷搜索"></div>
        </div>
      </section>

      <main id="appMain" class="app-main" tabindex="-1"></main>
    </div>

    <aside id="detailDrawer" class="detail-drawer" aria-hidden="true" aria-label="项目详情" tabindex="-1" inert></aside>
    <div id="drawerBackdrop" class="drawer-backdrop" hidden></div>
    <aside id="filterSheet" class="filter-sheet" aria-hidden="true" aria-label="筛选项目" tabindex="-1" inert></aside>
    <div id="filterBackdrop" class="filter-backdrop" hidden></div>
    <div id="compareTray" class="compare-tray" hidden></div>
    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

    <script type="module" src="./assets/app.js"></script>
  </body>
</html>
