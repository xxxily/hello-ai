    <a class="skip-link" href="#appMain">跳到主要内容</a>

      <header class="topbar">
        <a class="brand" href="./" aria-label="Hello-AI Explore">
          <img src="/assets/img/logo.png" alt="Hello-AI" width="36" height="36" />
          <span>
            <strong>Hello-AI</strong>
            <small>Explore</small>
          </span>
        </a>

        <nav class="main-nav" aria-label="Explore 页面">
          <button class="nav-button" type="button" data-route="radar">发现</button>
          <button class="nav-button" type="button" data-route="explore">全部项目</button>
          <button class="nav-button" type="button" data-route="compare">对比</button>
          <button class="nav-button" type="button" data-route="saved">收藏</button>
        </nav>

        <div class="top-actions">
          <a class="docs-link" href="/home/">Docs</a>
          <a
            class="github-link"
            href="https://github.com/xxxily/hello-ai"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="在 GitHub 查看并 Star Hello-AI"

            </svg>
            <span>GitHub</span>
            <strong>Star</strong>
          </a>
        </div>
      </header>

      <section class="command-band" aria-label="项目搜索">
        <div class="command-inner">
          <div class="command-copy">
            <p class="hero-label"><span aria-hidden="true"></span>持续更新的 AI 开源项目库</p>
            <h1>发现适合你的 AI 开源项目</h1>
            <p class="hero-summary">搜索、筛选、对比，快速找到值得关注的项目。</p>
            <a
              class="hero-github"
              href="https://github.com/xxxily/hello-ai"
              target="_blank"
              rel="noopener noreferrer"
            >
              <span>GitHub 开源</span>
              <strong>github.com/xxxily/hello-ai</strong>
              <b aria-hidden="true">↗</b>
            </a>
          </div>

          <div class="stat-strip" id="statStrip" aria-live="polite">
            <div class="stat-loading">正在加载项目数据…</div>
          </div>

          <label class="search-box" for="globalSearch">
            <span class="search-symbol" aria-hidden="true">⌕</span>
            <input
              id="globalSearch"
              name="project-search"
              type="search"
              aria-label="搜索 AI 项目或技术"
              autocomplete="off"
              spellcheck="false"
              placeholder="搜索项目或技术，例如 Agent、GraphRAG、本地模型…"
            />
          </label>

          <div class="quick-strip" id="quickStrip" aria-label="快捷搜索"></div>
        </div>
      </section>

      <main id="appMain" class="app-main" tabindex="-1"></main>

      <footer class="site-footer">

          <div class="footer-copy">
            <a class="footer-brand" href="./">Hello-AI Explore</a>
            <p>持续收录和整理值得关注的 AI 开源项目。</p>

              <strong>github.com/xxxily/hello-ai</strong>
            </span>
            <b>去 Star ↗</b>

        </div>
      </footer>
